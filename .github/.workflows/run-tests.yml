name: Run Python Tests

# Когда запускать workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:

jobs:
  test:
    # Виртуальная машина, на которой будут выполняться тесты
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # тесты на двух версиях Python

    steps:
      # 1. Клонируем репозиторий в виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python нужной версии
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Кэшируем pip-зависимости для ускорения
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Запускаем тесты через pytest
      - name: Run tests with pytest
        run: |
          pytest -v --tb=short

      # 6. (Опционально) Сохраняем отчёт о тестах как артефакт
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          if-no-files-found: ignore